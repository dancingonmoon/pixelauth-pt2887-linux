#
# 生物特征识别服务的配置文件
# 配置文件使用以下格式：
#   [驱动名]
#   Enable=true					#是否启用驱动，必填
#   Driver=/path/to/driver/so	#驱动文件路径，必填
#   Key=Value					#其他配置项，选填，例如串口驱动使用Path键指定串口的设备节点
#
 

[r301]
Enable=false
Driver=/usr/lib/biometric-authentication/drivers/r301.so
